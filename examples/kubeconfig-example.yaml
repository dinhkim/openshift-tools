# Example kubeconfig for OpenShift Authentication Plugin (Go)
#
# This file shows how to configure the Go-based authentication plugin
# in your ~/.kube/config file.
#
# Copy the relevant sections to your actual kubeconfig.

apiVersion: v1
kind: Config
preferences: {}

# Define your OpenShift cluster
clusters:
- cluster:
    # Your OpenShift API server URL
    server: https://api.my-cluster.example.com:6443
    # Optional: Certificate authority data
    # certificate-authority-data: LS0tLS1CRUdJTi...
    # Or skip TLS verification (not recommended for production)
    insecure-skip-tls-verify: true
  name: my-openshift-cluster

# Define the user with exec authentication
users:
- name: my-openshift-user
  user:
    exec:
      # Use v1 API (not v1beta1)
      apiVersion: client.authentication.k8s.io/v1
      
      # Command to run (must be in PATH or use full path)
      command: openshift-auth-plugin
      
      # Environment variables for the plugin
      env:
      # REQUIRED: Unique name for this cluster (used for token storage)
      - name: CLUSTER_NAME
        value: my-cluster
      
      # OPTIONAL: Enable debug logging
      - name: DEBUG
        value: "false"
      
      # OPTIONAL: Verify SSL certificates (default: false)
      - name: VERIFY_SSL
        value: "false"
      
      # OPTIONAL: Storage backend - "keychain" (macOS) or "gopass"
      - name: SECRET_STORE
        value: keychain
      
      # OPTIONAL: Enable SSO authentication (default: true)
      - name: SSO_ENABLED
        value: "true"
      
      # OPTIONAL: OAuth client ID (default: openshift-browser-client)
      - name: SSO_CLIENT_ID
        value: openshift-browser-client
      
      # OPTIONAL: SSO provider name (for display only)
      - name: SSO_PROVIDER
        value: Keycloak
      
      # Provide cluster info to the plugin (recommended)
      provideClusterInfo: true
      
      # Allow interactive authentication (recommended)
      interactiveMode: IfAvailable

# Define a context that combines cluster and user
contexts:
- context:
    cluster: my-openshift-cluster
    user: my-openshift-user
    # Optional: default namespace
    namespace: default
  name: my-openshift-context

# Set the current context
current-context: my-openshift-context

---
# Example: Multiple clusters with different configurations

apiVersion: v1
kind: Config
preferences: {}

clusters:
# Production cluster
- cluster:
    server: https://api.prod.example.com:6443
    insecure-skip-tls-verify: false
    certificate-authority-data: LS0tLS1CRUdJTi...
  name: prod-cluster

# Development cluster
- cluster:
    server: https://api.dev.example.com:6443
    insecure-skip-tls-verify: true
  name: dev-cluster

users:
# Production user - with SSL verification
- name: prod-user
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1
      command: openshift-auth-plugin
      env:
      - name: CLUSTER_NAME
        value: prod-cluster
      - name: VERIFY_SSL
        value: "true"
      - name: SECRET_STORE
        value: keychain
      provideClusterInfo: true
      interactiveMode: IfAvailable

# Development user - without SSL verification
- name: dev-user
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1
      command: openshift-auth-plugin
      env:
      - name: CLUSTER_NAME
        value: dev-cluster
      - name: VERIFY_SSL
        value: "false"
      - name: DEBUG
        value: "true"
      provideClusterInfo: true
      interactiveMode: IfAvailable

contexts:
- context:
    cluster: prod-cluster
    user: prod-user
    namespace: production
  name: prod

- context:
    cluster: dev-cluster
    user: dev-user
    namespace: development
  name: dev

current-context: dev

---
# Example: Using gopass for token storage

apiVersion: v1
kind: Config
preferences: {}

clusters:
- cluster:
    server: https://api.my-cluster.example.com:6443
    insecure-skip-tls-verify: true
  name: my-cluster

users:
- name: my-user
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1
      command: openshift-auth-plugin
      env:
      - name: CLUSTER_NAME
        value: my-cluster
      # Use gopass instead of macOS Keychain
      - name: SECRET_STORE
        value: gopass
      provideClusterInfo: true
      interactiveMode: IfAvailable

contexts:
- context:
    cluster: my-cluster
    user: my-user
  name: my-context

current-context: my-context

---
# Example: Explicit server URL (without provideClusterInfo)

apiVersion: v1
kind: Config
preferences: {}

clusters:
- cluster:
    server: https://api.my-cluster.example.com:6443
    insecure-skip-tls-verify: true
  name: my-cluster

users:
- name: my-user
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1
      command: openshift-auth-plugin
      env:
      - name: CLUSTER_NAME
        value: my-cluster
      # Explicitly set the OpenShift URL
      - name: OPENSHIFT_URL
        value: https://api.my-cluster.example.com:6443
      # Don't use provideClusterInfo
      # provideClusterInfo: false

contexts:
- context:
    cluster: my-cluster
    user: my-user
  name: my-context

current-context: my-context
